
name: Build John AI APK Maker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project files
        run: |
          echo "Checking project structure..."
          test -f settings.gradle || (echo "ERROR: Missing settings.gradle" && exit 1)
          test -f build.gradle || (echo "ERROR: Missing root build.gradle" && exit 1)
          test -f gradle.properties || (echo "ERROR: Missing gradle.properties" && exit 1)
          test -f app/build.gradle || (echo "ERROR: Missing app/build.gradle" && exit 1)
          test -f app/src/main/AndroidManifest.xml || (echo "ERROR: Missing AndroidManifest.xml" && exit 1)
          echo "Project files found."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: John-AI-APK-Maker
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
 
